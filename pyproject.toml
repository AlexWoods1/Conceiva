[project]
name = "donor-match"
version = "0.1.0"
description = "Carrier-risk decision support for couples and sperm banks."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "numpy>=2.5.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.3",
    "stripe>=13.0.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
motility = [
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
    "ultralytics>=8.3.0",
    "lap>=0.5.12",
    "opencv-python>=4.10.0",
    "numpy>=2.5.3",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "imageio-ffmpeg>=0.5.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.vercel]
entrypoint = "app.main:app"
